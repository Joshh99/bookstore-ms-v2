apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-bff
  namespace: bookstore-ns
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-bff
  template:
    metadata:
      labels:
        app: web-bff
    spec:
      containers:
      - name: web-bff
        image: ddnanam/web_bff:latest
        ports:
        - containerPort: 80
        env:
        - name: BOOK_URL
          value: http://book-service.bookstore-ns.svc.cluster.local:3000
        - name: CUSTOMER_URL
          value: http://customer-service.bookstore-ns.svc.cluster.local:3000
        livenessProbe:
          httpGet:
            path: /status
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10