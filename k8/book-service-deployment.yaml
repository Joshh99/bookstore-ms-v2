apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-service
  namespace: bookstore-ns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: book-service
  template:
    metadata:
      labels:
        app: book-service
    spec:
      containers:
      - name: book-service
        image: dnanam/book_service:latest
        ports:
        - containerPort: 3000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bookstore-secrets
              key: database-url
        - name: RECOMMENDATION_URL
          value: http://18.118.230.221/recommended-titles/isbn
        - name: IS_DEBUGGING
          value: "false"
        - name: APP_URL
          value: a6f819f0823d047b7a3d4b7d84bc6755-523274936.us-east-1.elb.amazonaws.com
        livenessProbe:
          httpGet:
            path: /books/status
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: circuit-state
          mountPath: /circuit_state
      volumes:
      - name: circuit-state
        emptyDir: {}